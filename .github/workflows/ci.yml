name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  reference:
    name: Protocol, client and generated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test vectors are up to date
        run: npm run vectors:check
      - name: Every VI is saved for LabVIEW 2020
        run: python tools/dev/lv_versions.py --expect 20.0
      - name: Caraya tests are up to date with the vectors
        run: python tests/caraya/build.py --check
      - name: Unit and end-to-end tests (reference server, web client)
        run: npm test

  labview:
    name: LabVIEW 2020 (Caraya, integration)
    # Needs the self-hosted Windows runner described in docs/ci.md (labels: self-hosted, windows,
    # labview-2020). Enable it with the repository variable LABVIEW_RUNNER=true.
    if: vars.LABVIEW_RUNNER == 'true'
    runs-on: [self-hosted, windows, labview-2020]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Caraya unit tests
        shell: pwsh
        run: .\scripts\run-caraya.ps1 -Report reports\caraya.xml
      - name: LabVIEW integration suite (fixture through the real server)
        shell: pwsh
        run: .\scripts\run-lv-integration.ps1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-reports
          path: reports/
          if-no-files-found: ignore

  version:
    name: Package version
    # Every pull request and every push to main builds a test package; a vX.Y.Z tag builds the
    # release package instead (release.yml).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.toml.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: toml
        run: |
          version=$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' vipm.toml | head -n 1)
          test -n "$version" || { echo "::error::no [project] version X.Y.Z in vipm.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: VI package
    needs: [reference, version]
    if: vars.LABVIEW_RUNNER == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build-number: ${{ github.run_number }}
