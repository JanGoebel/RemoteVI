name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reference:
    name: Protocol, client and generated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test vectors are up to date
        run: npm run vectors:check
      - name: Every VI is saved for LabVIEW 2020
        run: python tools/dev/lv_versions.py --expect 20.0
      - name: Caraya tests are up to date with the vectors
        run: python tests/caraya/build.py --check
      - name: Unit and end-to-end tests (reference server, web client)
        run: npm test

  labview:
    name: LabVIEW 2020 (Caraya, integration)
    # Needs the self-hosted Windows runner described in docs/ci.md (labels: self-hosted, windows,
    # labview-2020). Enable it with the repository variable LABVIEW_RUNNER=true.
    if: vars.LABVIEW_RUNNER == 'true'
    runs-on: [self-hosted, windows, labview-2020]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the packages of vipm.toml for LabVIEW 2020 (64-bit)
        shell: powershell
        run: |
          $vipm = (Get-Command vipm -ErrorAction SilentlyContinue).Source
          if (-not $vipm) { $vipm = Join-Path $env:ProgramFiles 'JKI\VI Package Manager\support\vipm.exe' }
          if (-not (Test-Path $vipm)) { throw 'vipm not found: install VIPM 2026 or newer on the runner (docs/ci.md)' }
          & $vipm --labview-version 2020 --labview-bitness 64 install
          if ($LASTEXITCODE -ne 0) { throw "vipm install failed ($LASTEXITCODE)" }
      - name: Caraya unit tests
        shell: powershell
        run: .\scripts\run-caraya.ps1 -Report reports\caraya.xml
      - name: LabVIEW integration suite (fixture through the real server)
        shell: powershell
        run: .\scripts\run-lv-integration.ps1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labview-reports
          path: reports/
          if-no-files-found: ignore
