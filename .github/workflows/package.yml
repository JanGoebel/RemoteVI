name: VI package

# Reusable: builds jgoebel_lib_remotevi-<version>.<build>.vip with scripts/build-package.ps1 on the
# self-hosted LabVIEW runner (docs/ci.md) and uploads it as the artifact `vi-package`.
# Called by ci.yml (pull requests and main) and release.yml (vX.Y.Z tags).
on:
  workflow_call:
    inputs:
      version:
        description: X.Y.Z
        type: string
        required: true
      build-number:
        description: 4th component of the package version
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build the VI package ${{ inputs.version }}.${{ inputs.build-number }}
    runs-on: [self-hosted, windows, labview-2020]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the packages of vipm.toml for LabVIEW 2020 (64-bit)
        shell: powershell
        run: |
          vipm --labview-version 2020 --labview-bitness 64 install
          if ($LASTEXITCODE -ne 0) { throw "vipm install failed ($LASTEXITCODE)" }
      - name: Build the executables and the package
        shell: powershell
        run: .\scripts\build-package.ps1 -Version '${{ inputs.version }}' -BuildNumber ${{ inputs.build-number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vi-package
          path: builds/*.vip
          if-no-files-found: error
          retention-days: 30
