name: Release

# Push a tag vX.Y.Z on main to build and publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build the VI package
    needs: tests
    if: vars.LABVIEW_RUNNER == 'true'
    runs-on: [self-hosted, windows, labview-2020]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build jgoebel_lib_remotevi-${{ github.ref_name }}.vip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          vipm build build\RemoteVI.vipb --version-number $version
          if ($LASTEXITCODE -ne 0) { throw "vipm build failed ($LASTEXITCODE)" }
          Get-ChildItem builds\*.vip | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: vi-package
          path: builds/*.vip
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [tests, package]
    # The package job is skipped when no LabVIEW runner is configured; release the sources then.
    if: always() && needs.tests.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source archive
        run: |
          name="RemoteVI-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${name}/" -o "${name}-source.zip" "${GITHUB_REF_NAME}" \
            source examples web docs README.md vipm.toml build
      - name: VI package from the LabVIEW runner
        if: needs.package.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: vi-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            RemoteVI-*-source.zip
            dist/*.vip
          fail_on_unmatched_files: false
