name: Release

# Push a tag vX.Y.Z to build the VI package and publish it as a GitHub release:
#   (set version = "X.Y.Z" in vipm.toml and commit it first)
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          LABVIEW_RUNNER: ${{ vars.LABVIEW_RUNNER }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          toml=$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' vipm.toml | head -n 1)
          if [ "$toml" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version = \"$toml\" in vipm.toml; set it to $version, commit, and tag that commit"
            exit 1
          fi
          if [ "$LABVIEW_RUNNER" != "true" ]; then
            echo "::error::the VI package is built on the self-hosted LabVIEW runner (docs/ci.md); set the repository variable LABVIEW_RUNNER=true"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: [tests, version]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build-number: ${{ github.run_number }}

  release:
    name: Publish the GitHub release
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vi-package
          path: dist
      - name: Source archive
        run: |
          name="RemoteVI-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${name}/" -o "dist/${name}-source.zip" "${GITHUB_REF_NAME}"
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          name: RemoteVI ${{ needs.version.outputs.version }}
          generate_release_notes: true
          # 0.x releases are marked as pre-releases
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') }}
          files: |
            dist/*.vip
            dist/*-source.zip
          fail_on_unmatched_files: true
